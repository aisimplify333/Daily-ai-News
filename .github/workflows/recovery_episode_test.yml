name: Recovery Episode Test

on:
  workflow_dispatch:
  push:
    branches:
      - recovery/september-2026
    paths:
      - .github/workflows/recovery_episode_test.yml

permissions:
  contents: read

concurrency:
  group: recovery-episode-test
  cancel-in-progress: true

jobs:
  build-without-publishing:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      XAI_API_KEY: ${{ secrets.GROK_XAI_API_KEY }}

      PODCAST_SHOW_TITLE: "The AI Edge"
      RECOVERY_BUILD_REVISION: "deterministic-structure-v5"
      SAVE_SCRIPT: "true"
      FORCE_REBUILD: "true"
      ALLOW_DUPLICATE_DATE_REBUILD: "false"
      RUN_MARKETING_ASSETS: "false"
      PUBLISH_SOCIAL: "false"
      RUN_POST_PUSH_PUBLISHER: "false"
      HARD_FAIL_PRE_TTS: "true"

      AUDIO_BACKEND: "openai"
      TTS_ROUTER_MODE: "hybrid"
      ALEX_TTS_PROVIDER: "openai"
      JAMIE_TTS_PROVIDER: "grok"
      RUFUS_TTS_PROVIDER: "openai"
      GROK_TTS_VOICE_JAMIE: "ursa"
      GROK_TTS_VOICE_JAMIE_FALLBACK: "celeste"
      GROK_TTS_MAX_RETRIES: "2"
      GROK_TTS_CACHE: "true"
      REQUIRE_JAMIE_PRIMARY: "true"
      OPENAI_TTS_MODEL: "gpt-4o-mini-tts"
      OPENAI_TTS_VOICE_ALEX: "onyx"
      OPENAI_TTS_VOICE_JAMIE: "marin"
      OPENAI_TTS_VOICE_RUFUS: "fable"
      ELEVENLABS_ENABLED: "false"
      ELEVEN_USE_DIALOGUE_SCENES: "false"

      WRITERS_ROOM_MODE: "budget_plus"
      STORY_BOARD_PROVIDER: "gemini"
      STORY_BOARD_MODEL: "gemini-3.1-flash-lite"
      STORY_BOARD_FALLBACK_MODEL: "gemini-3-flash-preview"
      SCENE_WRITER_PROVIDER: "anthropic"
      SCENE_WRITER_MODEL: "claude-sonnet-4-6"
      SCENE_WRITER_FALLBACK_MODEL: "claude-opus-4-7"
      PUNCHUP_PROVIDER: "xai"
      PUNCHUP_MODEL: "grok-4.3"
      RESCUE_PROVIDER: "openai"
      RESCUE_MODEL: "gpt-5.5"
      RESCUE_FALLBACK_MODEL: "gpt-5.4-mini"
      OPENAI_CHEAP_MODEL: "gpt-5.4-mini"
      ENABLE_GROK_PUNCHUP: "true"
      ENABLE_OPENAI_RESCUE: "true"
      ANTHROPIC_SCRIPT_MAX_TOKENS: "9000"
      PRE_TTS_MIN_SCORE: "84"
      NO_REPEAT_TITLE_WINDOW: "14"
      TOP_EVENT_MIN_SCORE: "34"
      MAX_STORY_AGE_HOURS: "48"

      MIN_MINUTES: "24"
      TARGET_MINUTES: "27"
      MAX_MINUTES: "30"
      WORDS_PER_MINUTE: "170"
      RECOVERY_MIN_SCRIPT_WORDS: "4200"
      RECOVERY_MAX_SCRIPT_WORDS: "5000"
      SEGMENT_ATTEMPTS: "5"
      FORWARDABLE_MIN_PER_EPISODE: "4"

      ALEX_GAIN_DB: "3.5"
      JAMIE_GAIN_DB: "1.0"
      RUFUS_GAIN_DB: "0.3"
      ALEX_SPEED: "1.05"
      JAMIE_SPEED: "0.99"
      RUFUS_SPEED: "1.01"
      INTER_TURN_SILENCE_MS: "140"
      REACTION_PAUSE_MS: "230"

      AUTO_BUILD_AUDIO_BRANDKIT: "false"
      REBUILD_AUDIO_BRANDKIT: "false"
      TRANSITION_EVERY_SEGMENT: "false"
      TRANSITION_MAX_PER_EPISODE: "3"
      TRANSITION_SEGMENTS: "2,4,5"
      CLEANUP_TEMP: "true"
      KEEP_LAST_EPISODES: "60"

    steps:
      - name: Check out production files without historical episodes
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            /*
            !/episode_audio/
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install audio and Python dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile and run zero-spend preflight
        run: |
          set -euo pipefail
          python -m py_compile main.py v3_1_runner.py writer_room_v3_1.py
          python -m py_compile hybrid_tts_router_v3_1.py grok_tts_v4.py
          python -m py_compile recovery_acceptance.py
          python preflight_guard_v3_1.py

      - name: Generate full recovery episode without publishing
        run: python v3_1_runner.py

      - name: Sanitize local feed and enforce no-repeat
        run: |
          set -euo pipefail
          python feed_sanitize_v3_1.py --feed feed.xml --report feed_sanitize_report.json
          python no_repeat_guard_v3_1.py --feed feed.xml --report duplicate_guard_report.json --window 14

      - name: Run objective recovery acceptance gate
        run: python recovery_acceptance.py

      - name: Stage current test only
        if: always()
        run: |
          set -euo pipefail
          mkdir -p _recovery_artifacts
          today="$(date -u +%F)"
          for file in \
            "script_${today}.txt" \
            "episode_audio/podcast_${today}.mp3" \
            "episode_audio/podcast_${today}.json" \
            "episode_audio/jamie_grok_ursa_voice_proof_${today}.mp3" \
            feed.xml \
            hybrid_tts_report.json \
            story_slate_decision.json \
            script_aircheck.json \
            episode_aircheck.json \
            recovery_acceptance_report.json \
            feed_sanitize_report.json \
            duplicate_guard_report.json; do
            if [[ -f "$file" ]]; then
              cp "$file" _recovery_artifacts/
            fi
          done

      - name: Upload nonpublishing episode
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: the-ai-edge-recovery-episode
          path: _recovery_artifacts/
          retention-days: 7
          if-no-files-found: warn
          compression-level: 0
