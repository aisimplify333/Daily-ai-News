name: ElevenLabs Reusable Production Library
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['specialty_audio/BUILD_ONCE']
permissions:
  contents: write
concurrency:
  group: elevenlabs-library
  cancel-in-progress: false
jobs:
  build:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          pip install pydub
      - name: Generate bounded reusable assets and assemble real-cast promos
        id: generation
        continue-on-error: true
        env:
          AI_EDGE_PODCAST_ELEVENLABS: ${{ secrets.AI_EDGE_PODCAST_ELEVENLABS }}
        run: python specialty_audio/build_library.py
      - name: Preserve completed work and attempt ledger
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add specialty_audio/library
          if ! git diff --cached --quiet; then
            git commit -m 'Preserve reusable sound library and promo candidates'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: elevenlabs-production-library
          path: specialty_audio/library
          retention-days: 30
          if-no-files-found: error
      - name: Surface generation failure without touching daily production
        if: steps.generation.outcome == 'failure'
        run: exit 1
