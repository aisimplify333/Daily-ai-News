name: Jamie Gemini comparison October 29
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['auditions/JAMIE_GEMINI_OCT29_RUN_ONCE']
permissions:
  contents: read
concurrency:
  group: jamie-gemini-oct29
  cancel-in-progress: false
jobs:
  audition:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /auditions/jamie_gemini_oct29.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install audio tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          pip install requests pydub
      - name: Generate three audition takes only
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python auditions/jamie_gemini_oct29.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jamie-gemini-oct29
          retention-days: 30
          path: auditions/jamie_gemini_output/
          compression-level: 0
