name: Grok Jamie Voice Audition

on:
  workflow_dispatch:
  push:
    branches:
      - recovery/september-2026
    paths:
      - .github/workflows/grok_voice_audition.yml
      - tools/grok_voice_audition.py

permissions:
  contents: read

concurrency:
  group: grok-jamie-voice-audition
  cancel-in-progress: true

jobs:
  audition:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      XAI_API_KEY: ${{ secrets.GROK_XAI_API_KEY }}
      GROK_JAMIE_VOICES: eve,sirius,iris,ursa,celeste

    steps:
      - name: Check out audition code only
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            tools/grok_voice_audition.py
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate Jamie voice samples
        run: python tools/grok_voice_audition.py --output-dir voice_audition

      - name: Upload audition only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jamie-grok-voice-audition
          path: voice_audition/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
