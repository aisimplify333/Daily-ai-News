name: Daily AI Podcast Generator

on:
  schedule:
    # Runs at 09:00 UTC daily (which is 4:00 AM EST)
    - cron: '0 9 * * *'
  workflow_dispatch: # Allows manual testing

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11' # Fixed: Uses newer Python

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run the Podcast Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} # Fixed: Unlocks the AI Writer
        run: |
          python main.py

      - name: Commit and Push New Episode
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add *.mp3 feed.xml
          git commit -m "Automated: New Daily Podcast Episode" || echo "No changes to commit"
          git push
