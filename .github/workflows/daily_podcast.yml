name: Daily Podcast & Socials

on:
  schedule:
    - cron: '0 13 * * *' # 6:00 AM PST (13:00 UTC)
  workflow_dispatch:      # Manual Trigger Button

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. SETUP
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 2. INSTALL SYSTEM LIBRARIES (Crucial for Video)
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick ghostscript
          # Fix for ImageMagick policy (Crucial for Video Text)
          sudo sed -i 's/none/read,write/g' /etc/ImageMagick-6/policy.xml

      # 3. INSTALL PYTHON LIBRARIES
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. RUN THE EMPIRE BROADCAST (The Soul & Video)
      - name: Run Empire Broadcast
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
        run: |
          python run_broadcast.py

      # 5. COMMIT ARTIFACTS (THE FIX IS HERE)
      - name: Commit and Push
        run: |
          # --- IDENTITY FIX ---
          git config --global user.name "AI Producer"
          git config --global user.email "bot@aisimplifymedia.com"
          # --------------------
          
          # Stage specific assets
          git add episode_audio/podcast_*.mp3
          git add feed.xml
          git add episode_metadata.json
          git add viral_caption.txt
          git add social_clip.mp4
          
          # Safety: Pull any remote changes to avoid merge conflicts
          git pull --rebase origin main || echo "No remote changes"
          
          # Commit & Push
          git commit -m "Automated: New Episode $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git push
