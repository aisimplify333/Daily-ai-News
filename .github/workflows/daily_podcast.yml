name: Daily AI Podcast Generator

on:
  schedule:
    - cron: '0 9 * * *' # Runs at 1:00 AM PST
  workflow_dispatch:    # Allows manual testing

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run the Podcast Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}  # <--- THIS WAS MISSING!
        run: |
          python main.py

      - name: Commit and Push New Episode
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          rm temp_voice.mp3 || true
          git add podcast_*.mp3 feed.xml
          git commit -m "Automated: New Daily Podcast Episode" || echo "No changes to commit"
          git push
