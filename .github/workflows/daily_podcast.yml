name: Daily Podcast & Socials

on:
  schedule:
    - cron: '0 10 * * *' # 2:00 AM PST (10:00 UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. SETUP
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 2. INSTALL SYSTEM LIBRARIES (Crucial for Video)
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick ghostscript
          # Fix for ImageMagick policy (Crucial for Video Text)
          sudo sed -i 's/none/read,write/g' /etc/ImageMagick-6/policy.xml

      # 3. INSTALL PYTHON LIBRARIES
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. RUN THE EMPIRE BROADCAST (The Soul & Video)
            - name: Run Empire Broadcast
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}

          # --- QUALITY GATES (ALIGN BOTH RUNNERS) ---
          MIN_EPISODE_MINUTES: "24"
          MIN_MINUTES: "24"
          MAX_MINUTES: "35"
          TARGET_MINUTES: "28"
          WORDS_PER_MINUTE: "175"
          JAMIE_SPEED: "1.05"

          # Optional: if you want to regenerate even if today's exists
          # FORCE_REBUILD: "true"

          # --- X/TWITTER CREDENTIALS (see next section) ---
          X_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          X_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
        run: |
          python run_broadcast.py


           # 5. COMMIT ARTIFACTS (HARDENED)
      - name: Commit and Push
        run: |
          git config user.name "AI Producer"
          git config user.email "bot@aisimplifymedia.com"

          # Always sync first (avoid rebase with staged changes)
          git pull --rebase origin main || echo "No remote changes"

          # Stage core assets (guard each add)
          git add feed.xml || true
          git add episode_metadata.json || true
          git add viral_caption.txt || true
          git add episode_audio/podcast_*.mp3 || true
          git add script_*.txt || true

          # Stage social clip ONLY if it exists; force-add because .gitignore ignores it
          if [ -f social_clip.mp4 ]; then
            git add -f social_clip.mp4
          else
            echo "No social_clip.mp4 found (skipping)"
          fi

          # Commit & push if anything changed
          git status --porcelain
          git commit -m "Automated: New Episode $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git push
