name: Daily Podcast & Socials

on:
  schedule:
    - cron: '0 9 * * *' # Runs at 9:00 AM UTC (1:00 AM PST)
  workflow_dispatch:    # Allows manual testing button

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Dependencies
        # THIS IS THE CRITICAL LINE: Installs requests, feedparser, and social tools
        run: |
          pip install openai pydub pillow tweepy feedparser requests

      - name: Run Audio Engine (Producer)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python main.py

      - name: Run Visual Engine (VFX)
        run: python animate_social.py

      - name: Commit and Push Everything
        run: |
          git config --global user.name 'AI Producer'
          git config --global user.email 'bot@aisimplifymedia.com'
          
          # 1. Add The Audio
          git add episode_audio/*.mp3
          
          # 2. Add The Feed & Data
          git add feed.xml
          git add episode_metadata.json
          
          # 3. Add The Social Assets
          git add viral_caption.txt
          git add social_surge.gif
          
          # 4. Commit and Push
          git commit -m "Automated: New Daily Episode & Social Assets" || echo "No changes to commit"
          git push
