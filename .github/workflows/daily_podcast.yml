name: Daily Podcast & Socials

on:
  schedule:
    # Avoid GitHub's documented top-of-hour schedule congestion. This is a
    # requested start time, not an exact-time delivery guarantee.
    - cron: '17 10 * * 1-5' # Mon-Fri 3:17 AM Pacific daylight time / 10:17 UTC
  workflow_dispatch:
permissions:
  contents: write

defaults:
  run:
    shell: bash

concurrency:
  group: daily-podcast-socials
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      SAVE_SCRIPT: "true"
      PODCAST_SHOW_TITLE: "The AI Edge"
      PODCAST_SHOW_DESCRIPTION: "The AI Edge is the weekday artificial intelligence news and analysis podcast where Alex, Jamie, and Rufus tell you what changed in AI, who wins, and what you do next. Each episode debates one lead story from the last 24–48 hours, using the other top AI events as evidence, complications, or counterarguments. Follow The AI Edge for new episodes Monday through Friday. What changed. Who wins. What you do next."

      # Cost-safe defaults. Do not let the old v3.0 marketing/social layer run inside main.py.
      RUN_MARKETING_ASSETS: "false"
      PUBLISH_SOCIAL: "false"
      FORCE_REBUILD: "false"
      HARD_FAIL_PRE_TTS: "true"
      ALLOW_DUPLICATE_DATE_REBUILD: "false"

      # Approved recovered cast routing.
      AUDIO_BACKEND: "openai"
      TTS_ROUTER_MODE: "hybrid"
      ALEX_TTS_PROVIDER: "openai"
      JAMIE_TTS_PROVIDER: "grok"
      GROK_TTS_VOICE_JAMIE: "ursa"
      GROK_TTS_VOICE_JAMIE_FALLBACK: "celeste"
      GROK_TTS_MAX_RETRIES: "2"
      GROK_TTS_CACHE: "true"
      REQUIRE_JAMIE_PRIMARY: "true"
      RUN_JAMIE_SMOKE_TEST: "false"
      RUFUS_TTS_PROVIDER: "openai"
      ELEVENLABS_ENABLED: "false"
      ELEVEN_USE_DIALOGUE_SCENES: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick ghostscript
          sudo sed -i 's/none/read,write/g' /etc/ImageMagick-6/policy.xml || true

      - name: Install Dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint compile fast fail
        run: |
          set -euo pipefail
          python -m py_compile main.py
          python -m py_compile v3_1_runner.py
          python -m py_compile writer_room_v3_1.py
          python -m py_compile growth_overlay_v3_1.py
          python -m py_compile preflight_guard_v3_1.py
          python -m py_compile feed_sanitize_v3_1.py
          python -m py_compile hybrid_tts_router_v3_1.py
          python -m py_compile no_repeat_guard_v3_1.py
          python -m py_compile production_delivery_gate.py
          python -m py_compile grounded_news_v1.py
          python -m py_compile grok_tts_v4.py
          python -m py_compile growth_engine.py
          python -m py_compile run_broadcast.py
          python -m tabnanny -v main.py
          python -m compileall -q .
          python -m unittest discover -s tests -v

      - name: Cheap cost-safe preflight before generation
        env:
          RUN_MARKETING_ASSETS: "false"
          FORCE_REBUILD: "false"
          ALLOW_DUPLICATE_DATE_REBUILD: "false"
          AUDIO_BACKEND: "openai"
          JAMIE_TTS_PROVIDER: "grok"
          GROK_TTS_VOICE_JAMIE: "ursa"
          GROK_TTS_VOICE_JAMIE_FALLBACK: "celeste"
          GROK_TTS_MAX_RETRIES: "2"
          GROK_TTS_CACHE: "true"
          REQUIRE_JAMIE_PRIMARY: "true"
          RUN_JAMIE_SMOKE_TEST: "false"
          ELEVENLABS_ENABLED: "false"
        run: |
          set -euo pipefail
          python preflight_guard_v3_1.py

      - name: Run The AI Edge v3.1 Cost-Safe Hybrid Broadcast
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          XAI_API_KEY: ${{ secrets.GROK_XAI_API_KEY }}

          # Voice stack: directed OpenAI onyx, Grok Ursa/Celeste, directed OpenAI fable.
          AUDIO_BACKEND: "openai"
          TTS_ROUTER_MODE: "hybrid"
          ALEX_TTS_PROVIDER: "openai"
          JAMIE_TTS_PROVIDER: "grok"
          GROK_TTS_VOICE_JAMIE: "ursa"
          GROK_TTS_VOICE_JAMIE_FALLBACK: "celeste"
          GROK_TTS_MAX_RETRIES: "2"
          GROK_TTS_CACHE: "true"
          REQUIRE_JAMIE_PRIMARY: "true"
          RUN_JAMIE_SMOKE_TEST: "false"
          RUFUS_TTS_PROVIDER: "openai"
          ELEVENLABS_ENABLED: "false"
          ELEVEN_USE_DIALOGUE_SCENES: "false"

          WRITERS_ROOM_MODE: "budget_plus"
          STORY_BOARD_PROVIDER: "gemini"
          STORY_BOARD_MODEL: "gemini-3.1-flash-lite"
          STORY_BOARD_FALLBACK_MODEL: "gemini-3-flash-preview"

          SCENE_WRITER_PROVIDER: "anthropic"
          SCENE_WRITER_MODEL: "claude-sonnet-4-6"
          SCENE_WRITER_FALLBACK_MODEL: "claude-opus-4-7"

          PUNCHUP_PROVIDER: "xai"
          PUNCHUP_MODEL: "grok-4.3"

          RESCUE_PROVIDER: "openai"
          RESCUE_MODEL: "gpt-5.5"
          RESCUE_FALLBACK_MODEL: "gpt-5.4-mini"
          OPENAI_CHEAP_MODEL: "gpt-5.4-mini"

          PRE_TTS_MIN_SCORE: "84"
          ENABLE_GROK_PUNCHUP: "false"
          ENABLE_OPENAI_RESCUE: "false"
          ANTHROPIC_SCRIPT_MAX_TOKENS: "8000"
          TOP_EVENT_MIN_SCORE: "34"
          MAX_STORY_AGE_HOURS: "48"
          MIN_TRUSTED_STORIES: "3"
          GROUNDING_REQUIRED: "true"
          GROUNDED_NEWS_MODEL: "gemini-3.1-flash-lite"
          GROUNDED_NEWS_FALLBACK_MODEL: "gpt-5.4-mini"
          ENABLE_GROUNDED_FACT_AUDIT: "false"
          NO_REPEAT_TITLE_WINDOW: "14"
          HARD_FAIL_PRE_TTS: "true"

          ALEX_USE_OPENAI: "true"
          OPENAI_TTS_MODEL: "gpt-4o-mini-tts"
          VOICE_MODEL_ALEX: "gpt-4o-mini-tts"
          VOICE_ALEX: "onyx"
          VOICE_MODEL_JAMIE: "gpt-4o-mini-tts"
          VOICE_JAMIE: "marin"
          VOICE_MODEL_RUFUS: "gpt-4o-mini-tts"
          VOICE_RUFUS: "fable"

          MIN_MINUTES: "19"
          MAX_MINUTES: "30"
          TARGET_MINUTES: "25"
          WORDS_PER_MINUTE: "145"
          RECOVERY_MIN_SCRIPT_WORDS: "3550"
          RECOVERY_MAX_SCRIPT_WORDS: "4350"
          RECOVERY_TARGET_SCRIPT_WORDS: "4200"
          SEGMENT_ATTEMPTS: "5"
          FORWARDABLE_MIN_PER_EPISODE: "4"
          STORY_BUCKET_CAP: "6"

          ALEX_GAIN_DB: "3.5"
          JAMIE_GAIN_DB: "1.0"
          RUFUS_GAIN_DB: "0.3"
          ALEX_SPEED: "1.01"
          JAMIE_SPEED: "1.05"
          RUFUS_SPEED: "0.99"

          INTER_TURN_SILENCE_MS: "120"
          REACTION_PAUSE_MS: "190"
          MAX_CONSECUTIVE_SAME_SPEAKER_LINES: "5"
          MAX_SPOKEN_WORDS_PER_LINE: "60"
          TRIM_TRAILING_MS: "130"
          TAIL_PAD_MS: "90"

          AUTO_BUILD_AUDIO_BRANDKIT: "false"
          REBUILD_AUDIO_BRANDKIT: "false"
          REQUIRE_TRANSITIONS: "true"
          TRANSITION_EVERY_SEGMENT: "true"
          TRANSITION_MAX_PER_EPISODE: "4"
          TRANSITION_SEGMENTS: "2,3,4,5"

          INTRO_BED_MS: "7200"
          INTRO_BED_FADE_OUT_MS: "2200"
          SEGMENT_BED_MS: "2200"
          SEGMENT_BED_FADE_OUT_MS: "850"
          MUSIC_TARGET_DBFS: "-27.0"
          SPONSOR_BED_TARGET_DBFS: "-24.0"
          SPONSOR_BED_DUCK_DB: "10.0"
          DUCK_THRESHOLD_DBFS: "-34.0"
          DUCK_AMOUNT_DB: "15.5"
          DUCK_WINDOW_MS: "35"
          STINGER_TARGET_DBFS: "-18.0"
          OUTRO_MS: "15000"
          OUTRO_TARGET_DBFS: "-16.5"
          OUTRO_FADE_IN_MS: "250"
          OUTRO_FADE_OUT_MS: "1800"
          MASTER_COMPRESSOR_THRESHOLD: "-16dB"
          MASTER_COMPRESSOR_RATIO: "2.2"
          MASTER_COMPRESSOR_ATTACK: "18"
          MASTER_COMPRESSOR_RELEASE: "180"
          MASTER_COMPRESSOR_MAKEUP: "2.5"
          SEGMENT_EXPORT_BITRATE: "192k"

          CLEANUP_TEMP: "true"
          KEEP_LAST_EPISODES: "60"
          RUN_MARKETING_ASSETS: "false"
          PUBLISH_SOCIAL: "false"
          FORCE_REBUILD: "false"
          PODCAST_COVER_IMAGE_URL: ${{ vars.PODCAST_COVER_IMAGE_URL }}
        run: |
          set -euo pipefail
          python run_broadcast.py

      - name: Stage current-run artifacts only
        if: always()
        run: |
          set -euo pipefail
          mkdir -p _run_artifacts
          today="$(date -u +%F)"
          for file in \
            feed.xml \
            preflight_report_v3_1.json \
            feed_sanitize_report.json \
            duplicate_guard_report.json \
            production_delivery_report.json \
            audio_qa_report.json \
            promo_assets_report.json \
            sponsor_delivery_report.json \
            hybrid_tts_report.json \
            script_aircheck.json \
            episode_aircheck.json \
            story_slate_decision.json \
            episode_metadata.json \
            story_scores.json \
            tracking_summary.json \
            forwardable_moments.json \
            shareable_exchange.json \
            listener_takeaways.json \
            final_button.json \
            listener_poll.json \
            listener_poll_results.json \
            show_trailer_script.txt \
            show_trailer_manifest.json \
            "script_${today}.txt" \
            "episode_audio/podcast_${today}.mp3" \
            "episode_audio/podcast_${today}.json" \
            "episode_audio/podcast_${today}.txt" \
            "episode_audio/podcast_${today}.timeline.json" \
            "episode_audio/clip_${today}.mp3" \
            "episode_audio/clip_${today}.mp4" \
            "episode_audio/clip_${today}.vtt" \
            "episode_audio/show_trailer.mp3" \
            "episode_audio/podcast_${today}.chapters.json"; do
            if [[ -f "$file" ]]; then
              cp "$file" _run_artifacts/
            fi
          done

      - name: Upload production artifacts always
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: the-ai-edge-v3-1-hybrid-tts-artifacts
          retention-days: 14
          if-no-files-found: ignore
          path: _run_artifacts/
          compression-level: 0
