name: Daily AI Podcast Generator

on:
  schedule:
    # Runs at 09:00 UTC daily (which is 4:00 AM EST)
    - cron: '0 9 * * *'
  workflow_dispatch: # Allows you to run this manually with a button click to test it

permissions:
  contents: write # CRITICAL: Allows the bot to save the MP3 back to your repo

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install FFmpeg
        # Required for pydub to save MP3 files
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run the Podcast Script
        run: |
          python main.py

      - name: Commit and Push New Episode
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          # Add the specific files we want to save
          git add *.mp3 feed.xml
          # Commit only if there are changes
          git commit -m "Automated: New Daily Podcast Episode" || echo "No changes to commit"
          git push