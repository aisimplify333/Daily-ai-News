name: Daily Podcast & Socials

on:
  schedule:
    - cron: '0 9 * * *' # Runs at 9:00 AM UTC (1:00 AM PST)
  workflow_dispatch:    # Allows manual testing button

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. SETUP
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # 2. INSTALL SYSTEM LIBRARIES (Heavy Lifting)
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # 3. INSTALL PYTHON DEPENDENCIES (The "Everything" List)
      - name: Install Dependencies
        run: |
          pip install openai pydub pillow tweepy feedparser requests duckduckgo-search ffmpeg-normalize moviepy numpy

      # 4. PHASE 1: AUDIO PRODUCTION (Search, Script, TTS, Mastering)
      - name: Run Audio Engine (Producer)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python main.py

      # 5. PHASE 2: VISUAL PRODUCTION (Vertical Video Generation)
      - name: Run Visual Engine (VFX)
        run: python animate_social.py

      # 6. PHASE 3: SOCIAL DISTRIBUTION (The Megaphone)
      # Note: This requires TWITTER secrets in your Repo Settings.
      # If you haven't set them yet, this step will skip or fail safely.
      - name: Run Social Publisher
        env:
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
        run: python social_publisher.py

      # 7. SAVE ARTIFACTS (Commit back to Repo)
      - name: Commit and Push Everything
        run: |
          git config --global user.name 'AI Producer'
          git config --global user.email 'bot@aisimplifymedia.com'
          
          # Add Audio
          git add episode_audio/*.mp3
          
          # Add Metadata & Feeds
          git add feed.xml
          git add episode_metadata.json
          
          # Add Social Assets (Video & Caption)
          git add viral_caption.txt
          git add social_clip.mp4
          
          # Commit
          git commit -m "Automated: New Daily Episode & Social Video" || echo "No changes to commit"
          git push
