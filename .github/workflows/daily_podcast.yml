name: Daily Podcast & Socials

on:
  schedule:
    - cron: '0 9 * * *' # 9:00 AM UTC (1:00 AM PST)
  workflow_dispatch:    # Manual trigger

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. SETUP
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches full history, helpful to avoid sync conflicts

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # 2. INSTALL SYSTEM LIBRARIES
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick ghostscript
          # Fix for ImageMagick policy (often needed for MoviePy TextClips)
          sudo sed -i 's/none/read,write/g' /etc/ImageMagick-6/policy.xml

   # 3. INSTALL PYTHON DEPENDENCIES
      - name: Install Python Libs
        run: |
          pip install --upgrade pip
          # We pin Pillow to 9.5.0 because MoviePy 1.0.3 needs 'ANTIALIAS'
          pip install openai pydub "pillow==9.5.0" tweepy feedparser requests duckduckgo-search \
          ffmpeg-normalize "moviepy==1.0.3" numpy replicate librosa \
          google-api-python-client google-auth-oauthlib google-auth-httplib2
          
      # 4. PHASE 1: AUDIO
      - name: Run Audio Engine
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python main.py

      # 5. PHASE 2: VISUAL PRODUCTION
      - name: Run Visual Engine
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
        run: python animate_social.py

      # 6. PHASE 3: SOCIALS
      - name: Run Social Publisher
        env:
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
        run: python social_publisher.py

      # 7. COMMIT ARTIFACTS
      - name: Commit and Push
        run: |
          git config --global user.name 'AI Producer'
          git config --global user.email 'bot@aisimplifymedia.com'
          
          # Staging files
          git add episode_audio/*.mp3
          git add feed.xml
          git add episode_metadata.json
          git add viral_caption.txt
          git add social_clip.mp4
          
          # Safety check: Pull changes if repo updated during the build
          git pull --rebase origin main || echo "No remote changes to merge"
          
          # Commit and Push
          git commit -m "Automated: New Episode $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git push
