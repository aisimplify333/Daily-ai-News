name: Alex and Rufus casting audition
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['auditions/ENSEMBLE_RUN_ONCE']
permissions:
  contents: read
concurrency:
  group: ensemble-cast-audition
  cancel-in-progress: false
jobs:
  audition:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /auditions/ensemble_cast.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          pip install requests pydub
      - name: Render bounded audition only
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          XAI_API_KEY: ${{ secrets.GROK_XAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python auditions/ensemble_cast.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alex-rufus-casting
          path: auditions/ensemble_output/
          retention-days: 30
          compression-level: 0
