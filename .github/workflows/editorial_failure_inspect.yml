name: Inspect saved editorial failure
on:
  push:
    paths: ['.github/workflows/editorial_failure_inspect.yml']
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Read preserved writing diagnostic without generation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          destination="$(mktemp -d)"
          gh run download 41123927519 --repo aisimplify333/Daily-ai-News --name the-ai-edge-v3-1-hybrid-tts-artifacts --dir "$destination"
          cat "$destination/jamie_transformation_rejected.json"
