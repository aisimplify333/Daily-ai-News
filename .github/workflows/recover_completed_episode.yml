name: Recover completed episode delivery
on:
  push:
    branches: [main]
    paths: [DELIVERY_RECOVERY_RUN_ONCE]
permissions:
  contents: write
  actions: read
concurrency:
  group: daily-podcast-socials
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/episode_audio/*.mp3
            !/episode_audio/*.mp4
            !/.tts_cache/
            /episode_audio/podcast_2026-10-13.mp3
            /episode_audio/podcast_2026-10-14.mp3
            /episode_audio/clip_2026-10-14.mp3
            /episode_audio/clip_2026-10-14.mp4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore reviewed completed master without generation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 38533183014 --repo "$GITHUB_REPOSITORY" --name the-ai-edge-v3-1-hybrid-tts-artifacts --dir /tmp/completed_episode
          python recover_completed_episode.py --source /tmp/completed_episode --date 2026-10-14 --sha256 76b1a66c27ff84f0ad55c1d21f808b51a7b8eb6874b6786b5bc2e6c61fd8ca14
      - name: Validate delivery package and rebuild episode pages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          pip install pydub feedparser requests google-genai
          python repair_oct14_sound.py
          python production_delivery_gate.py --feed feed.xml --min-minutes 19 --max-minutes 30
          python episode_pages.py
      - name: Review repaired full master
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python review_rendered_episode.py --date 2026-10-14
      - name: Publish recovered episode
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse -- . ':(exclude).tts_cache' ':(exclude)_voice_recovery' ':(exclude)_run_artifacts'
          git commit -m 'Publish completed October 14 episode recovered after staging failure'
          git push origin main
      - name: Verify public feed page and MP3
        run: python verify_publication.py --date 2026-10-14 --attempts 60 --interval 20
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: completed-delivery-recovery
          path: |
            completed_recovery_report.json
            production_delivery_report.json
            public_delivery_report.json
            rendered_audio_review.json
            oct14_audio_repair_report.json
            audio_engineering_report.json
            sound_design_report.json
