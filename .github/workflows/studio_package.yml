name: Build and review cohesive studio sound package
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['specialty_audio/STUDIO_BUILD_ONCE']
permissions:
  contents: write
concurrency:
  group: studio-sound-package
  cancel-in-progress: false
jobs:
  build:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*.py
            /specialty_audio/
            /episode_audio/podcast_2026-10-13.mp3
            /episode_audio/podcast_2026-10-13.timeline.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          pip install pydub google-genai
      - name: Commission once, render and review
        env:
          AI_EDGE_PODCAST_ELEVENLABS: ${{ secrets.AI_EDGE_PODCAST_ELEVENLABS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m specialty_audio.build_studio_package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-sound-package
          path: specialty_audio/studio
          retention-days: 30
      - name: Preserve paid assets and review evidence
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- specialty_audio/studio
          if ! git diff --cached --quiet; then
            git commit -m 'Preserve studio sound family, demonstration and audio review'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
