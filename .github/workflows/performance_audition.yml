name: Bounded cast performance audition
on:
  push:
    branches: ['audition/performance-20260920']
    paths: ['auditions/PERFORMANCE_RUN_ONCE']
permissions:
  contents: read
jobs:
  audition:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*.py
            /auditions/
            /tests/
            /specialty_audio/
            /.github/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          pip install requests pydub Pillow
      - name: Offline checks
        run: |
          python -m compileall -q .
          python -m unittest discover -s tests -v
      - name: Render twelve takes once and reuse for both edits
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          XAI_API_KEY: ${{ secrets.GROK_XAI_API_KEY }}
          GROK_TTS_MAX_RETRIES: '1'
          GROK_TTS_VOICE_JAMIE: ursa
        run: python auditions/performance_comparison.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cast-performance-comparison
          retention-days: 30
          path: auditions/performance_output/
          compression-level: 0
