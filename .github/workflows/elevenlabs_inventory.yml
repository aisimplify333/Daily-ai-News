name: ElevenLabs Specialty - Read-only Inventory

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: elevenlabs-specialty-inventory
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: specialty_audio
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read account allowance and voice catalog without synthesis
        env:
          AI_EDGE_PODCAST_ELEVENLABS: ${{ secrets.AI_EDGE_PODCAST_ELEVENLABS }}
        run: python specialty_audio/inspect_account.py
      - uses: actions/upload-artifact@v4
        with:
          name: elevenlabs-read-only-inventory
          path: specialty_account_report/account_and_voices.json
          retention-days: 3
          if-no-files-found: error
